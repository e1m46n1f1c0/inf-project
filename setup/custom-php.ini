; =================================================================
; CONFIGURACIÓN PERSONALIZADA DE PHP (custom-php.ini)
; Infinyti Framework
; =================================================================

; -----------------------------------------------------------------
; 1. Límites de Recursos y Carga de Archivos
; -----------------------------------------------------------------
; Límite de memoria que puede consumir un script
memory_limit = 512M

; Tamaño máximo permitido para archivos subidos
upload_max_filesize = 100M

; Tamaño máximo permitido para peticiones POST (debe ser >= upload_max_filesize)
post_max_size = 100M

; -----------------------------------------------------------------
; 2. Límites de Tiempo y Procesamiento (Timeouts)
; -----------------------------------------------------------------
; Tiempo máximo de ejecución de un script (en segundos). 0 = sin límite.
max_execution_time = 300

; Tiempo máximo para recibir datos de entrada (GET, POST, archivos).
max_input_time = 300

; Límite máximo de variables en peticiones (evita truncar formularios gigantes)
max_input_vars = 5000

; Límite de tiempo para la entrada de sockets
default_socket_timeout = 300

; -----------------------------------------------------------------
; 3. Reporte de Errores y Depuración (Logs)
; -----------------------------------------------------------------
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /var/www/html/logs/php_errors.log

; -----------------------------------------------------------------
; 4. Configuración Regional
; -----------------------------------------------------------------
date.timezone = America/Bogota
